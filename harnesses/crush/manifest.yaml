# harnesses/crush/manifest.yaml
name: crush
version: "latest"
install: npm install -g @charmland/crush

invoke:
  command: crush run "$PROMPT"
  model_flag: -m benchmark/$MODEL_NAME

setup: |
  mkdir -p ~/.config/crush
  cat > ~/.config/crush/crush.json <<CRUSHEOF
  {
    "providers": {
      "benchmark": {
        "name": "Benchmark",
        "type": "openai",
        "base_url": "$MODEL_URL",
        "api_key": "$API_KEY",
        "models": [
          {
            "id": "$MODEL_NAME",
            "name": "$MODEL_NAME"
          }
        ]
      }
    }
  }
  CRUSHEOF

metric_source: events.jsonl
metric_format: crush
