# harnesses/codex/manifest.yaml
# PARKED (2026-09-29): codex requires wire_api = "responses" (chat removed
# Feb 2026, rejected through 0.159.0) but no available upstream serves
# /responses (BigModel + Z.ai both 404). Not in benchmark.yaml; revive only
# with a proxy Responses→Chat bridge or a Responses-capable upstream.
name: codex
version: "latest"
install: npm install -g @openai/codex

invoke:
  command: codex exec --json --skip-git-repo-check --sandbox danger-full-access - < "$PROMPT_FILE"
  model_flag: -m $MODEL_NAME

setup: |
  mkdir -p ~/.codex
  cat > ~/.codex/config.toml <<CODEXEOF
  model = "$MODEL_NAME"
  model_provider = "benchmark"
  model_context_window = 1048576
  model_max_output_tokens = 131072

  [model_providers.benchmark]
  name = "Benchmark Proxy"
  base_url = "$MODEL_URL"
  env_key = "API_KEY"
  wire_api = "responses"
  CODEXEOF

metric_source: events.jsonl
metric_format: codex
