# harnesses/dsh/manifest.yaml
name: dsh
version: "latest"
install: npm install -g @deepseek-ai/dsh

invoke:
  command: dsh --profile headless "$PROMPT"
  model_flag: ""

setup: |
  mkdir -p ~/.dsh
  cat > ~/.dsh/settings.yaml <<DSHEOF
  agent-default-model:
    provider: benchmark
    model: "$MODEL_NAME"
  llm-pi-ai:
    providers:
      benchmark:
        apiKeyEnv: LLM_API_KEY
        api: openai-completions
        baseURL: "$MODEL_URL"
        models:
          - id: "$MODEL_NAME"
  DSHEOF

metric_source: events.jsonl
metric_format: dsh
